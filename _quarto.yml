project:
  type: website
  output-dir: docs

website:
  title: "Andrés Aguirre"
  description: "Portafolio de Ciencia de Datos: análisis, modelado y soluciones basadas en datos."
  site-url: https://andagui-ds.github.io/portfolio/
  repo-url: https://github.com/andagui-ds/portfolio
  repo-actions: [edit, issue]

  navbar:
    left:
      - href: index.qmd
        text: Inicio
        icon: house
      - href: proyectos.qmd
        text: Repositorios
        icon: folder2-open
      - href: about.qmd
        text: Sobre mí
        icon: person
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/andagui-ds/
      - icon: github
        href: https://github.com/andagui-ds
      - icon: envelope
        href: mailto:andagui.ds@gmail.com

  page-footer:
    left: |
      © 2026 **Andrés Aguirre** · Hecho con <a href="https://quarto.org" target="_blank">Quarto</a>
    center: |
      <a href="https://www.linkedin.com/in/andagui-ds/" target="_blank">LinkedIn</a> · <a href="https://github.com/andagui-ds" target="_blank">GitHub</a>
    right: |
      Actualizado: noviembre 2026
    border: true

  back-to-top-navigation: true

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    css: styles.css
    code-fold: true
    code-summary: "🔍 Ver código"
    toc: true
    toc-depth: 3
    toc-location: right
    fig-cap-location: bottom
    tbl-cap-location: top
    include-after-body: [traffic.html, translate.html]
    
execute:
  freeze: auto