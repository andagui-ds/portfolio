<!-- Script de traducción automática -->
<script src="https://cdn.jsdelivr.net/npm/i18n-jsautotranslate@1.0.0/i18n-jsautotranslate.min.js"></script>
<script>
    // Inicializa la traducción automática. 
    // Por defecto detecta el idioma del navegador.
    i18n.init({
        defaultLanguage: 'es', // Tu idioma principal (español)
        languages: ['en', 'es'], // Idiomas disponibles
        showSelector: true // Muestra un pequeño selector de idioma
    });
</script>
